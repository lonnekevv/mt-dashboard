// ── HELPERS ────────────────────────────────────────────────────────────
function getMondayStr(d) { const day=d.getDay(),diff=d.getDate()-day+(day===0?-6:1); const m=new Date(d); m.setDate(diff); return m.toISOString().slice(0,10); }
function formatWeekLabel(s) { const mon=new Date(s+"T00:00:00"),fri=new Date(mon); fri.setDate(mon.getDate()+4); return mon.getDate()+" – "+fri.toLocaleDateString("nl-NL",{day:"numeric",month:"long",year:"numeric"}); }
function num(v) { const n=parseFloat(String(v).replace(",",".")); return isNaN(n)?0:n; }
function pct(gewerkt, patient) { return gewerkt>0 ? Math.round((patient/gewerkt)*1000)/10 : null; }
function pctColor(p) {
  if (p==null) return BRAND.textMuted;
  if (p>=75) return BRAND.success;
  if (p>=55) return BRAND.warn;
  return BRAND.danger;
}
function tijdNaarUren(t) { if(!t) return 0; const [h,m]=String(t).split(":").map(Number); return (h||0)+(m||0)/60; }
function roosterVoorCollega(c) { return ROOSTER[c] || [null,null,null,null,null]; }
function dagenDefault(c) {
  return roosterVoorCollega(c).map((d,i)=>({
    dag: DAG_NAMEN[i],
    start: d ? d[0] : "",
    eind: d ? d[1] : "",
    vrij: !d,
  }));
}
// Vaste pauzeblokken (#FCFC47), elke werkdag hetzelfde — overlap met de werktijd wordt afgetrokken van de gewerkte uren
const PAUZE_SLOTS = [["10:05","10:20"],["12:25","13:00"],["15:05","15:20"],["17:25","18:00"]];
function overlapUren(s1,e1,s2,e2) { return Math.max(0, Math.min(e1,e2)-Math.max(s1,s2)); }
function berekenDagUren(d) {
  if (!d || d.vrij || !d.start || !d.eind) return 0;
  const startU = tijdNaarUren(d.start), eindU = tijdNaarUren(d.eind);
  if (eindU<=startU) return 0;
  let bruto = eindU-startU;
  let pauze = 0;
  PAUZE_SLOTS.forEach(function(slot){ pauze += overlapUren(startU,eindU,tijdNaarUren(slot[0]),tijdNaarUren(slot[1])); });
  return Math.round(Math.max(0,bruto-pauze)*4)/4;
}
function berekenGewerktUitDagen(dagen) {
  if (!Array.isArray(dagen)) return 0;
  return Math.round(dagen.reduce((s,d)=>s+berekenDagUren(d),0)*4)/4;
}

function fileToBase64(file) {
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = () => resolve(r.result.split(",")[1]);
    r.onerror = () => reject(new Error("Kon bestand niet lezen"));
    r.readAsDataURL(file);
  });
}

// De AGENDA_PROMPT en de aanroep naar de Anthropic API leven weer client-side,

// eenmalige API-key invoer, opgeslagen in localStorage onder 'ft_apikey'.

function getApiKey() {
  return localStorage.getItem("ft_apikey") || "";
}

function vraagApiKey() {
  return new Promise(function(resolve) {
    var overlay = document.createElement("div");
    overlay.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px";
    overlay.innerHTML = '<div style="background:#fff;border-radius:12px;padding:24px;max-width:380px;width:100%;font-family:\'Poppins\',sans-serif"><p style="font-size:15px;font-weight:700;color:#82176D;margin-bottom:8px">API key invoeren</p><p style="font-size:13px;color:#555;line-height:1.6;margin-bottom:16px">Voer eenmalig de API key in. Deze wordt opgeslagen in je browser en hoef je daarna niet opnieuw in te voeren.</p><input id="prod-apikey-input" type="password" placeholder="sk-ant-api03-..." style="width:100%;padding:10px 12px;border-radius:8px;border:1.5px solid #e6cde0;font-size:14px;box-sizing:border-box;margin-bottom:8px;font-family:monospace"><p id="prod-apikey-fout" style="font-size:12px;color:#f87171;display:none;margin-bottom:8px">Voer een geldige key in (begint met sk-ant-).</p><button id="prod-apikey-opslaan" style="width:100%;padding:11px;border-radius:8px;border:none;background:#82176D;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:\'Poppins\',sans-serif">Opslaan en doorgaan</button></div>';
    document.body.appendChild(overlay);
    var input = overlay.querySelector("#prod-apikey-input");
    var btn = overlay.querySelector("#prod-apikey-opslaan");
    var fout = overlay.querySelector("#prod-apikey-fout");
    var opslaan = function() {
      var val = input.value.trim();
      if (!val.startsWith("sk-ant-")) { fout.style.display = "block"; return; }
      localStorage.setItem("ft_apikey", val);
      document.body.removeChild(overlay);
      resolve(val);
    };
    btn.onclick = opslaan;
    input.onkeydown = function(e) { if (e.key === "Enter") opslaan(); };
  });
}

async function zorgVoorApiKey() {
  var key = getApiKey();
  if (!key) key = await vraagApiKey();
  return key;
}

const AGENDA_PROMPT_INTRO = "Je krijgt een screenshot van de weekagenda van één fysio-collega bij Fyzio Totaal. De agenda heeft vijf kolommen (maandag t/m vrijdag); de datum staat bovenaan de kolom, de dagnaam staat er direct onder. Elke rij heeft links een tijdstip en rechts een blok dat duurt tot het volgende tijdstip.\n\n"
  + "De begin- en eindtijd van de werkdag hoef je NIET te bepalen (dat komt uit een vast rooster). Jouw enige taak is: classificeer elk blok in de agenda op basis van zijn achtergrondkleur, aan de hand van de EXACTE kleurenlijst hieronder. Vergelijk de kleur van elk blok met deze lijst en kies de dichtstbijzijnde match.\n\n"
  + "BELANGRIJK: blokken ZONDER tekst tellen net zo goed mee als blokken met tekst — classificeer puur op de achtergrondkleur, ook als het vak leeg oogt. \"MT-uren\" (#0AFFFF, een felle cyaan/turkoois) zijn bijvoorbeeld vaak volledig blanco maar hebben wél die duidelijke cyaan kleur — mis deze niet en verwar ze niet met \"FyzioFit uur\" (#AB7DBF, een dof grijspaars), dat is een heel andere, veel minder felle kleur.\n\n"
  + "KLEURENLIJST (hexcode → betekenis → categorie):\n";

function bouwLegendaTekst() {
  return COLOR_LEGEND.map(function(c){
    var extra = c.conditioneel ? " [LET OP: telt alleen mee als er ook echt \"Patientafspraak\"-tekst bij dit blok staat; is het leeg/blanco zonder patiënt, dan telt het NERGENS in mee]" : "";
    return c.hex + " = \"" + c.label + "\" → categorie: " + c.cat + extra;
  }).join("\n");
}

const AGENDA_PROMPT_OUTRO = "\n\nCategorieën uitgelegd:\n"
  + "- \"patient\": patiëntcontact.\n"
  + "- \"overig_productief\": geen patiëntcontact, maar wel productieve werktijd voor de praktijk (MT-uren, vergadertijd).\n"
  + "- \"niet_productief\": aanwezig, maar telt niet mee als productief (bijv. FyzioFit uur-label zelf, contactmoment, afgemelde afspraken).\n"
  + "- \"afwezig\": pauze/vakantie/afwezigheid — negeer volledig, telt nergens in mee.\n"
  + "- \"notitie\": kleur #FFA142, onduidelijk of dit productief is — tel dit apart op, het wordt straks handmatig bevestigd.\n\n"
  + "Sla tekstregels die beginnen met \"-\" en die ONDER een ander blok staan volledig over — dat zijn persoonlijke notities, geen blokken.\n\n"
  + "Tel per dag het totaal aantal uren per categorie op (op basis van start- en eindtijd van elk blok, afgerond op kwartieren). Antwoord ALLEEN met een geldig JSON-object in dit formaat, zonder andere tekst of markdown-opmaak:\n"
  + "{\"dagen\":[{\"dag\":\"maandag\",\"patient_uren\":0,\"overig_productief_uren\":0,\"niet_productief_uren\":0,\"notitie_uren\":0},{\"dag\":\"dinsdag\",\"patient_uren\":0,\"overig_productief_uren\":0,\"niet_productief_uren\":0,\"notitie_uren\":0},{\"dag\":\"woensdag\",\"patient_uren\":0,\"overig_productief_uren\":0,\"niet_productief_uren\":0,\"notitie_uren\":0},{\"dag\":\"donderdag\",\"patient_uren\":0,\"overig_productief_uren\":0,\"niet_productief_uren\":0,\"notitie_uren\":0},{\"dag\":\"vrijdag\",\"patient_uren\":0,\"overig_productief_uren\":0,\"niet_productief_uren\":0,\"notitie_uren\":0}],\"opmerking\":\"\"}\n\n"
  + "Het veld \"opmerking\" mag een korte (max 20 woorden) toelichting bevatten over onzekere interpretaties, anders een lege string.";

async function analyzeAgendaScreenshot(base64, mediaType) {
  const apiKey = await zorgVoorApiKey();
  const promptText = AGENDA_PROMPT_INTRO + bouwLegendaTekst() + AGENDA_PROMPT_OUTRO;
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: "claude-sonnet-4-5",
      max_tokens: 2000,
      messages: [{
        role: "user",
        content: [
          { type: "image", source: { type:"base64", media_type: mediaType || "image/png", data: base64 } },
          { type: "text", text: promptText }
        ]
      }]
    })
  });
  if (!response.ok) {
    const errText = await response.text();
    throw new Error("HTTP "+response.status+": "+errText);
  }
  const data = await response.json();
  const textOut = data.content.map(function(b){ return b.text || ""; }).join("");
  const clean = textOut.replace(/```json|```/g,"").trim();
  let parsed;
  try { parsed = JSON.parse(clean); }
  catch(e) {
    console.error("Kon AI-antwoord niet parsen. stop_reason:", data.stop_reason, "ruwe tekst:", textOut);
    if (data.stop_reason === "max_tokens") throw new Error("Antwoord van de AI was afgebroken (te lang) — probeer het opnieuw of vul handmatig in");
    throw new Error("Kon de agenda niet automatisch interpreteren — vul handmatig in");
  }
  const dagenRaw = Array.isArray(parsed.dagen) ? parsed.dagen : [];
  const dagen = dagenRaw.map(function(d){
    return {
      dag: d.dag,
      patient: Math.round((Number(d.patient_uren)||0)*4)/4,
      overigProductief: Math.round((Number(d.overig_productief_uren)||0)*4)/4,
      nietProductief: Math.round((Number(d.niet_productief_uren)||0)*4)/4,
      notitie: Math.round((Number(d.notitie_uren)||0)*4)/4,
    };
  });
  const patientU = dagen.reduce((s,d)=>s+d.patient,0);
  const overigProductiefU = dagen.reduce((s,d)=>s+d.overigProductief,0);
  const nietProductiefU = dagen.reduce((s,d)=>s+d.nietProductief,0);
  const notitieU = dagen.reduce((s,d)=>s+d.notitie,0);
  return {
    patient: Math.round(patientU*4)/4,
    opmerking: parsed.opmerking || "",
    breakdown: {
      dagen,
      patient: Math.round(patientU*4)/4,
      overigProductief: Math.round(overigProductiefU*4)/4,
      nietProductief: Math.round(nietProductiefU*4)/4,
      notitiePending: Math.round(notitieU*4)/4,
    }
  };
}

function ProdBar({ label, p, sub }) {
  const color = pctColor(p);
  const width = p==null ? 0 : Math.min(100, Math.max(2, p));
  return (
    <div style={{marginBottom:10}}>
      <div style={{display:"flex",justifyContent:"space-between",fontSize:12,color:BRAND.text,marginBottom:3}}>
        <span style={{fontWeight:500}}>{label}</span>
        <span style={{fontWeight:600,color}}>{p==null?"—":p+"%"}</span>
      </div>
      <div style={{background:BRAND.purplePale,borderRadius:6,height:10,overflow:"hidden"}}>
        <div style={{width:width+"%",height:"100%",background:color,borderRadius:6,transition:"width .2s"}}/>
      </div>
      {sub && <div style={{fontSize:11,color:BRAND.textMuted,marginTop:2}}>{sub}</div>}
    </div>
  );
}

// ── INVOER TAB ────────────────────────────────────────────────────────
function InvoerTab({formData,setFormData}) {
  const {weeks,collegas,reload,syncStatus,syncMsg,addCollega} = React.useContext(DataCtx);
  const [currentMonday,setCurrentMonday] = useState(getMondayStr(new Date()));
  const [saved,setSaved] = useState(false);
  const [saving,setSaving] = useState(false);
  const [saveErr,setSaveErr] = useState("");
  const [newCollega,setNewCollega] = useState("");
  const [aiState,setAiState] = useState({}); // {[collega]: {status:'idle'|'loading'|'error', msg}} — puur voor de actie zelf, niet persistent
  const [npInput,setNpInput] = useState({}); // {[collega]: "1.5"} handmatige correctie voor 'notitie'-blokken
  const [editingDays,setEditingDays] = useState({}); // {[collega]: true} toont dag-editor voor uitzonderingen

  useEffect(()=>{
    const wk = weeks[currentMonday];
    const m = {};
    collegas.forEach(c=>{ m[c] = (wk && wk[c]) ? {...emptyRow(),...wk[c]} : emptyRow(); });
    setFormData(m);
    setSaved(false);
    setAiState({});
    setNpInput({});
  },[currentMonday,weeks,collegas]);

  const onVal=useCallback((c,field,v)=>{
    setFormData(p=>({...p,[c]:{...p[c],[field]:v,_ai:null}}));
    setSaved(false);
  },[]);

  function getDagen(c,row) { return (row && row.dagen) ? row.dagen : dagenDefault(c); }

  function setDag(c, idx, field, value) {
    setFormData(p=>{
      const row = p[c];
      const dagen = getDagen(c,row).map(d=>({...d}));
      dagen[idx] = {...dagen[idx], [field]: value};
      return {...p, [c]: {...row, dagen}};
    });
    setSaved(false);
  }

  function resetRooster(c) {
    setFormData(p=>({...p, [c]: {...p[c], dagen:null}}));
    setSaved(false);
  }

  async function persist(dataToSave) {
    setSaving(true); setSaveErr("");
    try { await saveRow(currentMonday, dataToSave); await reload(); setSaved(true); }
    catch(e) { setSaveErr(e.message); }
    finally { setSaving(false); }
  }

  async function handleSave() { await persist(formData); }

  async function handleScreenshot(c, file) {
    setAiState(p=>({...p,[c]:{status:"loading",msg:""}}));
    try {
      const base64 = await fileToBase64(file);
      const result = await analyzeAgendaScreenshot(base64, file.type);
      const updated = {...formData, [c]:{
        ...formData[c],
        patient:String(result.patient),
        _ai:{ ...result.breakdown, opmerking:result.opmerking||"" }
      }};
      setFormData(updated);
      setAiState(p=>({...p,[c]:{status:"ok",msg:""}}));
      setNpInput(p=>({...p,[c]:""}));
      await persist(updated);
    } catch(e) {
      setAiState(p=>({...p,[c]:{status:"error",msg:e.message}}));
    }
  }

  async function confirmNotitie(c) {
    const extra = num(npInput[c]);
    const row = formData[c];
    if (!row._ai) return;
    const updated = {...formData, [c]:{
      ...row,
      _ai: {...row._ai, overigProductief: Math.round((row._ai.overigProductief+extra)*4)/4, notitiePending:0}
    }};
    setFormData(updated);
    await persist(updated);
  }

  async function removeUpload(c) {
    const updated = {...formData, [c]: emptyRow()};
    setFormData(updated);
    setAiState(p=>({...p,[c]:{status:"idle",msg:""}}));
    setNpInput(p=>({...p,[c]:""}));
    await persist(updated);
  }

  function handleAddCollega() {
    const naam = newCollega.trim();
    if (!naam || collegas.includes(naam)) return;
    addCollega(naam);
    setNewCollega("");
  }

  return (
    <div>
      <SyncBar status={syncStatus} msg={syncMsg}/>
      <div className="sel-row">
        <label style={{fontSize:13,color:BRAND.textMuted,fontWeight:500}}>Week van maandag</label>
        <input type="date" value={currentMonday} onChange={e=>{setCurrentMonday(e.target.value);setSaved(false);}}/>
        <span style={{fontSize:12,color:BRAND.textMuted}}>{formatWeekLabel(currentMonday)}</span>
        {weeks[currentMonday] && <span style={{padding:"2px 10px",borderRadius:20,fontSize:12,fontWeight:500,background:BRAND.bluePale,color:BRAND.blueDark}}>Eerder opgeslagen</span>}
      </div>

      <div style={{display:"flex",gap:8,alignItems:"flex-start",background:BRAND.bluePale,border:"1px solid "+BRAND.blueBorder,borderRadius:8,padding:"10px 14px",marginBottom:"0.9rem",fontSize:12,color:BRAND.blueDark}}>
        <span>📅</span>
        <span>"Uren gewerkt" komt automatisch uit ieders basisrooster, met de vaste pauzeblokken (10:05-10:20, 12:25-13:00, 15:05-15:20, 17:25-18:00) er al automatisch afgetrokken. Klik op "dagen aanpassen" bij een collega om uitzonderingen door te geven (vrij, later begonnen, eerder gestopt). Upload eventueel ook een agenda-screenshot per collega — de AI vult dan "Uren patiëntcontact" in op basis van Fyzio Totaal's exacte kleurenlijst.</span>
      </div>

      <div className="tbl-wrap" style={{marginBottom:"1rem"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
          <thead><tr style={{background:BRAND.purple}}>
            {["Collega","Screenshot","Uren gewerkt","Uren patiëntcontact","Productiviteit"].map((h,i)=>(
              <th key={i} style={{textAlign:i===0?"left":"center",padding:"9px 10px",fontWeight:500,fontSize:12,color:"rgba(255,255,255,0.9)",whiteSpace:"nowrap"}}>{h}</th>
            ))}
          </tr></thead>
          <tbody>
            {collegas.map(c=>{
              const row = formData[c] || emptyRow();
              const dagen = getDagen(c,row);
              const gewerkt = berekenGewerktUitDagen(dagen);
              const p = pct(gewerkt, num(row.patient));
              const st = aiState[c] || {status:"idle",msg:""};
              const isAangepast = !!row.dagen;
              return (
                <React.Fragment key={c}>
                <tr style={{borderBottom:"0.5px solid "+BRAND.border}}>
                  <td style={{padding:"8px 10px",fontWeight:500,color:BRAND.text}}>{c}</td>
                  <td style={{textAlign:"center",padding:"6px 8px"}}>
                    <input type="file" accept="image/*" id={"ss-"+c} style={{display:"none"}}
                      onChange={e=>{ const f=e.target.files[0]; if(f) handleScreenshot(c,f); e.target.value=""; }}/>
                    <button onClick={()=>document.getElementById("ss-"+c).click()} disabled={st.status==="loading"}
                      title="Upload agenda-screenshot"
                      style={{background:"transparent",border:"1px solid "+BRAND.blueBorder,borderRadius:6,padding:"5px 10px",fontSize:13,cursor:st.status==="loading"?"not-allowed":"pointer",color:BRAND.blueDark,fontFamily:"'Poppins',sans-serif"}}>
                      {st.status==="loading"?"⏳":"📷"}
                    </button>
                    {row._ai && st.status!=="loading" && <div style={{fontSize:10,color:BRAND.blueDark,marginTop:3}}>🤖 AI-ingevuld</div>}
                    {st.status==="error" && <div style={{fontSize:10,color:BRAND.danger,marginTop:3,maxWidth:120}}>⚠ {st.msg}</div>}
                    {row._ai && row._ai.opmerking && <div style={{fontSize:10,color:BRAND.textMuted,marginTop:3,maxWidth:120}}>ℹ {row._ai.opmerking}</div>}
                    {(gewerkt>0 || row.patient!=="" || isAangepast) && (
                      <button onClick={()=>removeUpload(c)} title="Wis alle gegevens van deze collega voor deze week"
                        style={{background:"none",border:"none",color:BRAND.danger,fontSize:10,textDecoration:"underline",cursor:"pointer",padding:0,marginTop:3,fontFamily:"'Poppins',sans-serif"}}>
                        ✕ wis deze week
                      </button>
                    )}
                    {row._ai && (
                      <div style={{fontSize:10,color:BRAND.textMuted,marginTop:3}}>Uitsplitsing: zie tab "Per collega"</div>
                    )}
                    {row._ai && row._ai.notitiePending>0 && (
                      <div style={{fontSize:10,color:BRAND.warn,marginTop:5,background:BRAND.warnBg,border:"1px solid "+BRAND.warn,borderRadius:6,padding:"5px 6px",maxWidth:140,textAlign:"left"}}>
                        🟠 {row._ai.notitiePending}u in "notitie"-blokken. Hoeveel telt mee als productief (niet-patiëntcontact)?
                        <div style={{display:"flex",gap:4,marginTop:4}}>
                          <input type="number" min="0" max={row._ai.notitiePending} step="0.25" value={npInput[c]||""} placeholder="0"
                            onChange={e=>setNpInput(p=>({...p,[c]:e.target.value}))}
                            style={{width:44,minHeight:26,padding:"2px 4px",fontSize:11,textAlign:"center"}}/>
                          <button onClick={()=>confirmNotitie(c)} style={{background:BRAND.warn,color:"#fff",border:"none",borderRadius:5,padding:"2px 8px",fontSize:10,cursor:"pointer",fontFamily:"'Poppins',sans-serif"}}>OK</button>
                        </div>
                      </div>
                    )}
                  </td>
                  <td style={{textAlign:"center",padding:"6px 8px"}}>
                    <div style={{fontWeight:600,color:BRAND.text}}>{gewerkt}u</div>
                    <button onClick={()=>setEditingDays(p=>({...p,[c]:!p[c]}))}
                      style={{background:"none",border:"none",color:BRAND.blueDark,fontSize:10,textDecoration:"underline",cursor:"pointer",padding:0,fontFamily:"'Poppins',sans-serif"}}>
                      {editingDays[c] ? "verberg dagen" : "dagen aanpassen"}
                    </button>
                    {isAangepast && <div style={{fontSize:9,color:BRAND.warn,marginTop:2}}>afwijkend van rooster</div>}
                  </td>
                  <td style={{textAlign:"center",padding:"6px 8px"}}>
                    <input type="number" min="0" step="0.5" value={row.patient} style={{width:70,textAlign:"center"}}
                      onChange={e=>onVal(c,"patient",e.target.value)}/>
                  </td>
                  <td style={{textAlign:"center",padding:"6px 8px",fontWeight:600,color:pctColor(p)}}>{p==null?"—":p+"%"}</td>
                </tr>
                {editingDays[c] && (
                  <tr>
                    <td colSpan="5" style={{padding:"8px 10px",background:BRAND.purplePale}}>
                      <div style={{display:"flex",flexWrap:"wrap",gap:10,alignItems:"flex-end"}}>
                        {dagen.map((d,i)=>(
                          <div key={i} style={{display:"flex",flexDirection:"column",gap:3}}>
                            <label style={{fontSize:10,fontWeight:600,color:BRAND.textMuted,textTransform:"capitalize"}}>{d.dag}</label>
                            <label style={{display:"flex",alignItems:"center",gap:3,fontSize:10,color:BRAND.text}}>
                              <input type="checkbox" checked={!!d.vrij} onChange={e=>setDag(c,i,"vrij",e.target.checked)}/> vrij
                            </label>
                            {!d.vrij && (
                              <div style={{display:"flex",gap:3}}>
                                <input type="text" placeholder="7:35" value={d.start} onChange={e=>setDag(c,i,"start",e.target.value)} style={{width:52,fontSize:11,padding:"3px 4px"}}/>
                                <span style={{fontSize:11,color:BRAND.textMuted}}>–</span>
                                <input type="text" placeholder="17:00" value={d.eind} onChange={e=>setDag(c,i,"eind",e.target.value)} style={{width:52,fontSize:11,padding:"3px 4px"}}/>
                              </div>
                            )}
                          </div>
                        ))}
                        <button onClick={()=>resetRooster(c)} style={{background:"none",border:"1px solid "+BRAND.purpleBorder,borderRadius:6,padding:"5px 10px",fontSize:11,cursor:"pointer",color:BRAND.purpleMid,fontFamily:"'Poppins',sans-serif",height:28}}>↺ reset naar rooster</button>
                      </div>
                    </td>
                  </tr>
                )}
                </React.Fragment>
              );
            })}
          </tbody>
        </table>
      </div>

      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:"1.25rem",flexWrap:"wrap"}}>
        <input type="text" placeholder="Naam nieuwe collega" value={newCollega} onChange={e=>setNewCollega(e.target.value)} style={{flex:"0 1 200px"}}/>
        <button onClick={handleAddCollega} style={{background:"transparent",border:"1px solid "+BRAND.purpleBorder,borderRadius:8,padding:"8px 14px",fontSize:12,cursor:"pointer",color:BRAND.purpleMid,fontFamily:"'Poppins',sans-serif"}}>+ Collega toevoegen</button>
      </div>

      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:"1.5rem"}}>
        <button onClick={handleSave} disabled={saving} style={{background:BRAND.blueDark,color:"#fff",border:"none",borderRadius:8,padding:"9px 24px",fontSize:13,fontWeight:500,cursor:saving?"not-allowed":"pointer",opacity:saving?0.7:1,fontFamily:"'Poppins',sans-serif"}}>
          {saving?"Opslaan…":"Opslaan"}
        </button>
        {saved && <span style={{fontSize:13,color:BRAND.success}}>☁ Opgeslagen en gesynchroniseerd</span>}
        {saveErr && <span style={{fontSize:13,color:BRAND.danger}}>⚠ {saveErr}</span>}
      </div>

      <div style={{fontSize:13,fontWeight:500,color:BRAND.textMuted,marginBottom:10}}>Deze week in één oogopslag</div>
      <div className="card-grid">
        {collegas.map(c=>{
          const row = formData[c] || emptyRow();
          const gewerkt = berekenGewerktUitDagen(getDagen(c,row));
          const p = pct(gewerkt, num(row.patient));
          return (
            <div key={c} style={{background:"#fff",border:"0.5px solid "+BRAND.border,borderRadius:10,padding:"12px 14px",borderLeft:"3px solid "+pctColor(p)}}>
              <div style={{fontSize:13,fontWeight:500,color:BRAND.text,marginBottom:4}}>{c}</div>
              <div style={{fontSize:22,fontWeight:600,color:pctColor(p)}}>{p==null?"—":p+"%"}</div>
              <div style={{fontSize:11,color:BRAND.textMuted}}>{num(row.patient)}u pat. / {gewerkt}u werk</div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── COLLEGA (DETAIL) TAB ─────────────────────────────────────────────
function CollegaTab() {
  const {weeks,collegas,reload} = React.useContext(DataCtx);
  const [sel,setSel] = useState(collegas[0]||"");
  useEffect(()=>{ if(!sel && collegas.length) setSel(collegas[0]); },[collegas]);
  const [expanded,setExpanded] = useState({}); // {[wk]: true}
  const [deleting,setDeleting] = useState({}); // {[wk]: true}

  const rows = useMemo(()=>{
    return Object.keys(weeks).sort().reverse()
      .filter(wk => weeks[wk] && weeks[wk][sel])
      .map(wk => {
        const r = weeks[wk][sel];
        const dagen = r.dagen || dagenDefault(sel);
        const g = berekenGewerktUitDagen(dagen);
        const pt = num(r.patient);
        if (g===0 && pt===0 && !r._ai) return null;
        return { wk, g, pt, p: pct(g,pt), dagen, ai: r._ai || null };
      }).filter(Boolean);
  },[weeks,sel]);

  const avg = useMemo(()=>{
    const valid = rows.filter(r=>r.p!=null);
    if (!valid.length) return null;
    return Math.round((valid.reduce((s,r)=>s+r.p,0)/valid.length)*10)/10;
  },[rows]);

  async function deleteWeekEntry(wk) {
    setDeleting(p=>({...p,[wk]:true}));
    try {
      const updatedWeek = {...weeks[wk], [sel]: emptyRow()};
      await saveRow(wk, updatedWeek);
      await reload();
    } finally {
      setDeleting(p=>({...p,[wk]:false}));
    }
  }

  return (
    <div>
      <div className="sel-row">
        <label style={{fontSize:13,color:BRAND.textMuted,fontWeight:500}}>Collega</label>
        <select value={sel} onChange={e=>setSel(e.target.value)}>
          {collegas.map(c=><option key={c} value={c}>{c}</option>)}
        </select>
      </div>

      {avg!=null && (
        <div style={{background:"#fff",border:"0.5px solid "+BRAND.border,borderRadius:12,padding:"16px 18px",marginBottom:"1.25rem",borderTop:"3px solid "+pctColor(avg),textAlign:"center",maxWidth:220}}>
          <div style={{fontSize:36,fontWeight:700,color:pctColor(avg),lineHeight:1}}>{avg}%</div>
          <div style={{fontSize:12,color:BRAND.textMuted,marginTop:4}}>Gemiddelde productiviteit ({rows.filter(r=>r.p!=null).length} weken)</div>
        </div>
      )}

      <div style={{fontSize:13,fontWeight:500,color:BRAND.textMuted,marginBottom:10}}>Weekhistorie</div>
      {rows.length===0
        ? <div style={{fontSize:13,color:BRAND.textMuted,padding:"1rem"}}>Nog geen gegevens ingevoerd voor {sel}.</div>
        : rows.map(r=>(
            <div key={r.wk} style={{background:"#fff",border:"0.5px solid "+BRAND.border,borderRadius:10,padding:"12px 14px",marginBottom:10}}>
              <ProdBar label={formatWeekLabel(r.wk)} p={r.p} sub={r.pt+"u patiëntcontact van "+r.g+"u gewerkt (volgens rooster)"} />
              <div style={{display:"flex",gap:14,marginTop:2}}>
                <button onClick={()=>setExpanded(p=>({...p,[r.wk]:!p[r.wk]}))}
                  style={{background:"none",border:"none",color:BRAND.blueDark,fontSize:11,textDecoration:"underline",cursor:"pointer",padding:0,fontFamily:"'Poppins',sans-serif"}}>
                  {expanded[r.wk] ? "Verberg uitsplitsing" : "Toon uitsplitsing"}
                </button>
                <button onClick={()=>deleteWeekEntry(r.wk)} disabled={deleting[r.wk]}
                  style={{background:"none",border:"none",color:BRAND.danger,fontSize:11,textDecoration:"underline",cursor:deleting[r.wk]?"not-allowed":"pointer",padding:0,fontFamily:"'Poppins',sans-serif"}}>
                  {deleting[r.wk] ? "Bezig met wissen…" : "✕ wis deze week"}
                </button>
              </div>
              {expanded[r.wk] && (
                <div style={{marginTop:10,background:BRAND.purplePale,border:"1px solid "+BRAND.border,borderRadius:8,padding:"10px 12px"}}>
                  <div style={{fontWeight:600,fontSize:12,marginBottom:6,color:BRAND.text}}>Rooster deze week (bron van "gewerkt")</div>
                  <table style={{fontSize:12,borderCollapse:"collapse",width:"100%",marginBottom:10}}>
                    <thead><tr style={{color:BRAND.textMuted,borderBottom:"1px solid "+BRAND.border}}>
                      <th style={{textAlign:"left",padding:"3px 6px"}}>Dag</th>
                      <th style={{textAlign:"center",padding:"3px 6px"}}>Van</th>
                      <th style={{textAlign:"center",padding:"3px 6px"}}>Tot</th>
                      <th style={{textAlign:"right",padding:"3px 6px"}}>Uur</th>
                    </tr></thead>
                    <tbody>
                      {r.dagen.map((d,i)=>(
                        <tr key={i} style={{borderBottom:"0.5px solid "+BRAND.border}}>
                          <td style={{padding:"3px 6px",textTransform:"capitalize"}}>{d.dag}</td>
                          <td style={{textAlign:"center",padding:"3px 6px"}}>{d.vrij?"— (vrij)":d.start}</td>
                          <td style={{textAlign:"center",padding:"3px 6px"}}>{d.vrij?"—":d.eind}</td>
                          <td style={{textAlign:"right",padding:"3px 6px",fontWeight:600}}>{berekenDagUren(d)}u</td>
                        </tr>
                      ))}
                      <tr style={{fontWeight:700}}>
                        <td colSpan="3" style={{padding:"5px 6px",textAlign:"right"}}>Totaal gewerkt:</td>
                        <td style={{textAlign:"right",padding:"5px 6px"}}>{r.g}u</td>
                      </tr>
                    </tbody>
                  </table>
                  {r.ai ? (
                    <div style={{fontSize:12,color:BRAND.text,lineHeight:1.7}}>
                      {r.ai.opmerking && <div style={{fontSize:12,color:BRAND.textMuted,marginBottom:6}}>ℹ {r.ai.opmerking}</div>}
                      <div style={{fontWeight:600,marginBottom:2}}>Uit de agenda-screenshot (via kleurenlijst):</div>
                      <div>🩺 Patiëntcontact: <b>{r.ai.patient}u</b></div>
                      <div>📋 Overig productief (MT-uren, vergadering): <b>{r.ai.overigProductief}u</b></div>
                      <div>💤 Niet-productief (aanwezig, geen waarde): <b>{r.ai.nietProductief}u</b></div>
                      {r.ai.notitiePending>0 && <div>🟠 Notitie-blokken (nog niet bevestigd): <b>{r.ai.notitiePending}u</b> — ga naar Invoer om te bevestigen</div>}
                    </div>
                  ) : (
                    <div style={{fontSize:12,color:BRAND.textMuted}}>Patiëntcontact is handmatig ingevoerd voor deze week — geen screenshot-uitsplitsing beschikbaar.</div>
                  )}
                </div>
              )}
            </div>
          ))
      }
    </div>
  );
}

// ── TEAM TAB ──────────────────────────────────────────────────────────
function TeamTab() {
  const {weeks,collegas} = React.useContext(DataCtx);
  const sortedWeeks = useMemo(()=>Object.keys(weeks).filter(k=>k!==META_ID).sort().reverse(),[weeks]);
  const [wk,setWk] = useState("");
  useEffect(()=>{ if(sortedWeeks.length && !wk) setWk(sortedWeeks[0]); },[sortedWeeks]);

  const stats = useMemo(()=>{
    if (!wk || !weeks[wk]) return [];
    return collegas.map(c=>{
      const r = weeks[wk][c] || emptyRow();
      const dagen = r.dagen || dagenDefault(c);
      const g = berekenGewerktUitDagen(dagen), pt = num(r.patient);
      return { c, g, pt, p: pct(g,pt) };
    }).sort((a,b)=> (b.p??-1) - (a.p??-1));
  },[wk,weeks,collegas]);

  const teamAvg = useMemo(()=>{
    const valid = stats.filter(s=>s.p!=null);
    if (!valid.length) return null;
    return Math.round((valid.reduce((s,x)=>s+x.p,0)/valid.length)*10)/10;
  },[stats]);

  return (
    <div>
      <div className="sel-row">
        <label style={{fontSize:13,color:BRAND.textMuted,fontWeight:500}}>Kies week</label>
        <select value={wk} onChange={e=>setWk(e.target.value)}>
          {!sortedWeeks.length && <option>Nog geen weken opgeslagen</option>}
          {sortedWeeks.map(k=><option key={k} value={k}>{formatWeekLabel(k)}</option>)}
        </select>
      </div>

      {teamAvg!=null && (
        <div style={{background:"#fff",border:"0.5px solid "+BRAND.border,borderRadius:12,padding:"16px 18px",marginBottom:"1.5rem",borderTop:"3px solid "+BRAND.blueDark,textAlign:"center",maxWidth:260}}>
          <div style={{fontSize:36,fontWeight:700,color:BRAND.blueDark,lineHeight:1}}>{teamAvg}%</div>
          <div style={{fontSize:12,color:BRAND.textMuted,marginTop:4}}>Teamgemiddelde deze week</div>
        </div>
      )}

      <div style={{background:"#fff",border:"0.5px solid "+BRAND.border,borderRadius:12,padding:"16px 18px"}}>
        <div style={{fontSize:13,fontWeight:600,color:BRAND.text,marginBottom:14}}>Productiviteit per collega</div>
        {stats.length===0
          ? <div style={{fontSize:13,color:BRAND.textMuted}}>Nog geen data voor deze week.</div>
          : stats.map(s=>(
              <ProdBar key={s.c} label={s.c} p={s.p} sub={s.pt+"u patiëntcontact van "+s.g+"u gewerkt"} />
            ))
        }
      </div>
    </div>
  );
}

// ── ROOT APP ──────────────────────────────────────────────────────────
function App() {
  const [tab,setTab] = useState("invoer");
  useEffect(()=>{ window.__setTab = (id) => setTab(id); return ()=>{ delete window.__setTab; }; },[]);
  const [formData,setFormData] = useState({});
  const [weeks,setWeeks] = useState({});
  const [collegas,setCollegas] = useState(DEFAULT_COLLEGAS);
  const [syncStatus,setSyncStatus] = useState("loading");
  const [syncMsg,setSyncMsg] = useState("");

  async function reload() {
    setSyncStatus("loading");
    try {
      const d = await loadAll();
      const meta = d[META_ID];
      setCollegas(meta && Array.isArray(meta.list) && meta.list.length ? meta.list : DEFAULT_COLLEGAS);
      const wkData = {...d}; delete wkData[META_ID];
      setWeeks(wkData);
      setSyncStatus("ok"); setSyncMsg("");
    } catch(e) {
      setSyncStatus("error"); setSyncMsg(e.message);
    }
  }
  useEffect(()=>{ reload(); },[]);

  async function addCollega(naam) {
    const list = [...collegas, naam];
    setCollegas(list);
    try { await saveRow(META_ID, {list}); } catch(e) { /* stil falen, lijst blijft lokaal zichtbaar */ }
  }

  const ctxValue = useMemo(()=>({weeks,collegas,reload,syncStatus,syncMsg,addCollega}),[weeks,collegas,syncStatus,syncMsg]);
  const tabs = [
    {id:"invoer", label:"Invoer", icon:"✏️"},
    {id:"collega", label:"Per collega", icon:"👤"},
    {id:"team", label:"Team", icon:"👥"},
  ];

  useEffect(()=>{
    const bar = document.getElementById("mobile-tabs");
    if (!bar) return;
    bar.innerHTML = "";
    tabs.forEach(t=>{
      const b = document.createElement("button");
      b.className = tab===t.id ? "active" : "";
      b.onclick = ()=>goTab(t.id);
      b.innerHTML = '<span class="ticon">'+t.icon+'</span>'+t.label;
      bar.appendChild(b);
    });
  },[tab]);

  return (
    <DataCtx.Provider value={ctxValue}>
      <div>
        <div style={{background:"linear-gradient(135deg, "+BRAND.purple+" 0%, "+BRAND.purpleLight+" 100%)",padding:"18px 24px 0",borderRadius:"12px 12px 0 0"}}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
            <div style={{width:36,height:36,borderRadius:8,background:BRAND.blue,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20}}>📈</div>
            <div>
              <div style={{fontSize:16,fontWeight:600,color:"#fff"}}>Productiviteit</div>
              <div style={{fontSize:11,color:"rgba(255,255,255,0.7)"}}>Fyzio Totaal — Uren gewerkt vs. patiëntcontact</div>
            </div>
            <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:6,background:"rgba(255,255,255,0.14)",borderRadius:6,padding:"4px 10px",fontSize:11,color:"rgba(255,255,255,0.8)"}}>
              ☁ Gedeelde opslag
            </div>
          </div>
          <div className="desktop-tabs">
            {tabs.map(t=>(
              <button key={t.id} onClick={()=>setTab(t.id)} style={{background:tab===t.id?"#fff":"transparent",border:"none",borderRadius:"8px 8px 0 0",padding:"8px 16px",fontSize:13,fontWeight:tab===t.id?500:400,color:tab===t.id?BRAND.purple:"rgba(255,255,255,0.8)",cursor:"pointer",fontFamily:"'Poppins',sans-serif"}}>
                {t.icon} {t.label}
              </button>
            ))}
          </div>
        </div>
        <div style={{background:"#fff",border:"0.5px solid "+BRAND.border,borderTop:"none",borderRadius:"0 0 12px 12px",padding:"20px"}}>
          {syncStatus==="loading" && !Object.keys(weeks).length
            ? <div style={{textAlign:"center",padding:"3rem",color:BRAND.textMuted}}>Data laden uit gedeelde database…</div>
            : <>
                {tab==="invoer" && <InvoerTab formData={formData} setFormData={setFormData}/>}
                {tab==="collega" && <CollegaTab/>}
                {tab==="team" && <TeamTab/>}
              </>
          }
          <div style={{marginTop:"1.5rem",paddingTop:"1rem",borderTop:"0.5px solid "+BRAND.border,display:"flex",justifyContent:"flex-end",fontSize:11,color:BRAND.textMuted,alignItems:"center",gap:6}}>
            ☁ Gegevens worden opgeslagen in gedeelde Supabase-database
          </div>
        </div>
      </div>
    </DataCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
