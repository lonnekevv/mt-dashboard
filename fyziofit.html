<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FyzioFit Uren — Fyzio Totaal</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', sans-serif; background: #f5f5f3; min-height: 100vh; }
    #root { max-width: 980px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { opacity: 1; }
    input[type=date], select {
      padding: 5px 8px; border: 1px solid #e0e0da; border-radius: 6px;
      font-family: 'Outfit', sans-serif; font-size: 13px; background: #fff; color: #1a1a1a;
    }
    .sync-bar { display:flex; align-items:center; gap:8px; padding:8px 14px; border-radius:8px; margin-bottom:1rem; font-size:12px; font-weight:500; border:1px solid; }
    .sync-bar.ok    { background:#e6f4ec; color:#1a7a4a; border-color:#b2dfc4; }
    .sync-bar.error { background:#fdecea; color:#c0392b; border-color:#f5b7b1; }
    .sync-bar.loading { background:#fef3dc; color:#b45309; border-color:#f5d98a; }
    .sync-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
    .sync-dot.ok    { background:#1a7a4a; }
    .sync-dot.error { background:#c0392b; }
    .sync-dot.loading { background:#b45309; animation:pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    @keyframes spin { to { transform:rotate(360deg); } }
    .spin { animation:spin 1s linear infinite; display:inline-block; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useMemo, memo } = React;

// ── SUPABASE ─────────────────────────────────────────────────────────────
const SB_URL = "https://szunargvsmtzbbnmnghc.supabase.co/rest/v1";
const SB_KEY = "sb_publishable_EiIt1zJuqgjj-2FJ4mXTlg__kmUrPu5";
const SB_HDR = { "apikey":SB_KEY, "Authorization":"Bearer "+SB_KEY, "Content-Type":"application/json", "Prefer":"resolution=merge-duplicates" };

async function loadAll() {
  const r = await fetch(SB_URL+"/fyziofit_weeks?select=*&order=id.asc", { headers:SB_HDR });
  if (!r.ok) throw new Error("HTTP "+r.status);
  const rows = await r.json();
  const out = {};
  rows.forEach(row => { out[row.id] = row.data; });
  return out;
}
async function saveWeek(mondayStr, data) {
  const r = await fetch(SB_URL+"/fyziofit_weeks", {
    method:"POST", headers:SB_HDR,
    body: JSON.stringify({ id:mondayStr, data:data, updated_at:new Date().toISOString() })
  });
  if (!r.ok) { const t=await r.text(); throw new Error("HTTP "+r.status+": "+t); }
}

// ── BRAND + CONSTANTS ────────────────────────────────────────────────────
const BRAND = {
  green:"#1a4a3a", greenMid:"#2a6b52", greenLight:"#e8f2ee",
  orange:"#e8611a", orangeLight:"#fdf0e8",
  gray:"#f5f5f3", border:"#e0e0da", text:"#1a1a1a", textMuted:"#6b6b65",
  success:"#1a7a4a", successBg:"#e6f4ec",
  danger:"#c0392b", dangerBg:"#fdecea",
  warn:"#b45309", warnBg:"#fef3e2",
};
const DEFAULT_GROUPS = [
  { id:"ma13", day:"Maandag",   time:"13:00", collega:"Jan Willem", slots:2 },
  { id:"ma16", day:"Maandag",   time:"16:10", collega:"Lars",       slots:3 },
  { id:"di13", day:"Dinsdag",   time:"13:00", collega:"Laura",      slots:2 },
  { id:"di16", day:"Dinsdag",   time:"16:10", collega:"Lonneke",    slots:3 },
  { id:"wo13", day:"Woensdag",  time:"13:00", collega:"Thomas",     slots:2 },
  { id:"wo16", day:"Woensdag",  time:"16:10", collega:"Julia",      slots:3 },
  { id:"do13", day:"Donderdag", time:"13:00", collega:"Jesper",     slots:2 },
  { id:"do16", day:"Donderdag", time:"16:10", collega:"Laura",      slots:3 },
  { id:"vr13", day:"Vrijdag",   time:"13:00", collega:"Lynn",       slots:2 },
  { id:"vr16", day:"Vrijdag",   time:"16:10", collega:"Jesper",     slots:2 },
];
const FINANCE = ["10007","10008","10009","998"];
const FINANCE_LABELS = {"10007":"Declarabel","10008":"Zorgplan","10009":"Abonnement","998":"Zonder decl."};
const GROUP_DAY_INDEX = { ma13:0,ma16:0,di13:1,di16:1,wo13:2,wo16:2,do13:3,do16:3,vr13:4,vr16:4 };

// ── HELPERS ──────────────────────────────────────────────────────────────
function getMondayStr(d) { const day=d.getDay(),diff=d.getDate()-day+(day===0?-6:1); const m=new Date(d); m.setDate(diff); return m.toISOString().slice(0,10); }
function formatWeekLabel(s) { const mon=new Date(s+"T00:00:00"),fri=new Date(mon); fri.setDate(mon.getDate()+4); return mon.getDate()+" – "+fri.toLocaleDateString("nl-NL",{day:"numeric",month:"long",year:"numeric"}); }
function getMonthKey(s) { return s.slice(0,7); }
function emptyRow(slots) { const r={_skip:false,_slots:slots}; FINANCE.forEach(fc=>{r[fc]="";}); return r; }
function emptyForm() { const f={}; DEFAULT_GROUPS.forEach(g=>{f[g.id]=emptyRow(g.slots);}); return f; }
function getVal(row,fc) { return parseInt(row&&row[fc]?row[fc]:"0",10)||0; }
function getSlots(row,g) { return (row&&row._slots!=null)?row._slots:g.slots; }
function isSkip(row) { return row&&row._skip===true; }
function isRend(row,g) { return !isSkip(row)&&getVal(row,"10007")>=getSlots(row,g); }

// ── SHARED STATE via Context ─────────────────────────────────────────────
const WeeksCtx = React.createContext({weeks:{}, reload:()=>{}, syncStatus:"loading", syncMsg:""});

// ── SUB-COMPONENTS ───────────────────────────────────────────────────────
const NumInput = memo(function NumInput({value,onChange,disabled}) {
  return <input type="number" min="0" value={value} disabled={disabled} onChange={e=>onChange(e.target.value)}
    style={{width:48,textAlign:"center",fontSize:13,padding:"5px 2px",border:"1px solid "+BRAND.border,borderRadius:6,background:disabled?"#f5f5f3":"#fff",color:BRAND.text,outline:"none"}}/>;
});
const SlotsInput = memo(function SlotsInput({value,onChange}) {
  return <input type="number" min="1" max="6" value={value} onChange={e=>onChange(e.target.value)}
    style={{width:44,textAlign:"center",fontSize:13,padding:"4px 2px",border:"1px solid "+BRAND.border,borderRadius:6,background:"#fff",color:BRAND.text,outline:"none"}}/>;
});
function Badge({ok,skipped}) {
  if(skipped) return <span style={{display:"inline-flex",alignItems:"center",gap:4,padding:"2px 8px",borderRadius:20,fontSize:11,fontWeight:500,background:"#f0f0ee",color:BRAND.textMuted}}>Vervallen</span>;
  return <span style={{display:"inline-flex",alignItems:"center",gap:4,padding:"2px 8px",borderRadius:20,fontSize:11,fontWeight:500,background:ok?BRAND.successBg:BRAND.dangerBg,color:ok?BRAND.success:BRAND.danger}}><span style={{width:6,height:6,borderRadius:"50%",background:ok?BRAND.success:BRAND.danger}}/>{ok?"Rendabel":"Niet rendabel"}</span>;
}
const InvoerRow = memo(function InvoerRow({g,row,onVal,onSlots,onSkip}) {
  const skipped=isSkip(row),slots=getSlots(row,g),rend=isRend(row,g);
  return (
    <tr style={{borderBottom:"0.5px solid "+BRAND.border,background:skipped?"#f7f7f5":"#fff",opacity:skipped?0.6:1}}>
      <td style={{padding:"8px 10px",fontWeight:500,color:BRAND.text,whiteSpace:"nowrap"}}>{g.day}</td>
      <td style={{padding:"8px 10px",color:BRAND.textMuted}}>{g.time}</td>
      <td style={{padding:"8px 10px",color:BRAND.text}}>{g.collega}</td>
      <td style={{textAlign:"center",padding:"6px 8px"}}>{skipped?<span style={{color:BRAND.textMuted}}>—</span>:<SlotsInput value={slots} onChange={v=>onSlots(g.id,v)}/>}</td>
      {FINANCE.map(fc=><td key={fc} style={{textAlign:"center",padding:"6px 6px"}}>{skipped?<span style={{fontSize:12,color:BRAND.textMuted}}>—</span>:<NumInput value={row[fc]} onChange={v=>onVal(g.id,fc,v)} disabled={false}/>}</td>)}
      <td style={{textAlign:"center",padding:"8px 10px"}}><Badge ok={rend} skipped={skipped}/></td>
      <td style={{textAlign:"center",padding:"6px 8px"}}>
        <button onClick={()=>onSkip(g.id)} style={{background:"transparent",border:"0.5px solid "+BRAND.border,borderRadius:6,padding:"4px 8px",cursor:"pointer",color:skipped?BRAND.green:BRAND.textMuted,fontSize:12,fontFamily:"'Outfit',sans-serif"}}>
          {skipped?"Herstel":"Vervallen"}
        </button>
      </td>
    </tr>
  );
});

// ── SYNC BAR ─────────────────────────────────────────────────────────────
function SyncBar({status,msg}) {
  const labels={ok:"Gesynchroniseerd met gedeelde database",error:"Synchronisatiefout",loading:"Verbinden…"};
  return <div className={"sync-bar "+status}><div className={"sync-dot "+status}/><span>{labels[status]}{msg?" — "+msg:""}</span></div>;
}

// ── INVOER TAB ───────────────────────────────────────────────────────────
function InvoerTab({formData,setFormData}) {
  const {weeks,reload,syncStatus,syncMsg} = React.useContext(WeeksCtx);
  const [currentMonday,setCurrentMonday] = useState(getMondayStr(new Date()));
  const [saved,setSaved] = useState(false);
  const [saving,setSaving] = useState(false);
  const [saveErr,setSaveErr] = useState("");

  useEffect(()=>{
    if(!Object.keys(weeks).length) return;
    if(weeks[currentMonday]){
      const m={};
      DEFAULT_GROUPS.forEach(g=>{ m[g.id]={...emptyRow(g.slots),...(weeks[currentMonday][g.id]||{})}; if(m[g.id]._slots==null)m[g.id]._slots=g.slots; });
      setFormData(m);
    } else { setFormData(emptyForm()); }
    setSaved(false);
  },[currentMonday,weeks]);

  const onVal=useCallback((gid,fc,v)=>{ setFormData(p=>({...p,[gid]:{...p[gid],[fc]:v===""?"":String(Math.max(0,parseInt(v)||0))}})); setSaved(false); },[]);
  const onSlots=useCallback((gid,v)=>{ setFormData(p=>({...p,[gid]:{...p[gid],_slots:Math.max(1,Math.min(6,parseInt(v)||1))}})); setSaved(false); },[]);
  const onSkip=useCallback((gid)=>{ setFormData(p=>{ const row={...p[gid],_skip:!p[gid]._skip}; if(row._skip)FINANCE.forEach(fc=>{row[fc]="";}); return {...p,[gid]:row}; }); setSaved(false); },[]);

  async function handleSave() {
    setSaving(true); setSaveErr("");
    try {
      await saveWeek(currentMonday, formData);
      await reload();
      setSaved(true);
    } catch(e) { setSaveErr(e.message); }
    finally { setSaving(false); }
  }

  const collegaStats=useMemo(()=>{
    const collegas=[...new Set(DEFAULT_GROUPS.map(g=>g.collega))];
    return collegas.map(c=>{
      const cg=DEFAULT_GROUPS.filter(g=>g.collega===c),active=cg.filter(g=>!isSkip(formData[g.id]));
      const decl=active.reduce((s,g)=>s+getVal(formData[g.id],"10007"),0);
      const tot=active.reduce((s,g)=>FINANCE.reduce((ss,fc)=>ss+getVal(formData[g.id],fc),s),0);
      const rend=active.filter(g=>isRend(formData[g.id],g)).length;
      return {c,decl,tot,rend,total:active.length,allSkipped:cg.every(g=>isSkip(formData[g.id]))};
    });
  },[formData]);

  return (
    <div>
      <SyncBar status={syncStatus} msg={syncMsg}/>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:"1.25rem",flexWrap:"wrap",background:BRAND.gray,borderRadius:8,padding:"10px 14px",border:"0.5px solid "+BRAND.border}}>
        <label style={{fontSize:13,color:BRAND.textMuted,fontWeight:500}}>Week van maandag</label>
        <input type="date" value={currentMonday} onChange={e=>{setCurrentMonday(e.target.value);setSaved(false);}}/>
        <span style={{fontSize:12,color:BRAND.textMuted}}>{formatWeekLabel(currentMonday)}</span>
        {weeks[currentMonday]&&<span style={{padding:"2px 10px",borderRadius:20,fontSize:12,fontWeight:500,background:BRAND.greenLight,color:BRAND.green}}>Eerder opgeslagen</span>}
      </div>
      <div style={{marginBottom:"0.75rem",display:"flex",gap:16,flexWrap:"wrap"}}>
        {FINANCE.map(fc=><span key={fc} style={{display:"flex",alignItems:"center",gap:5,fontSize:12,color:BRAND.textMuted}}><span style={{width:8,height:8,borderRadius:2,background:BRAND.green}}/>{fc} – {FINANCE_LABELS[fc]}</span>)}
      </div>
      <div style={{overflowX:"auto",borderRadius:10,border:"0.5px solid "+BRAND.border,marginBottom:"1rem"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
          <thead><tr style={{background:BRAND.green}}>
            {["Dag","Tijd","Collega","Zittingen",...FINANCE,"Status",""].map((h,i)=>(
              <th key={i} style={{textAlign:i>3?"center":"left",padding:"9px 10px",fontWeight:500,fontSize:12,color:"rgba(255,255,255,0.85)",whiteSpace:"nowrap"}}>{h}</th>
            ))}
          </tr></thead>
          <tbody>{DEFAULT_GROUPS.map(g=><InvoerRow key={g.id} g={g} row={formData[g.id]||emptyRow(g.slots)} onVal={onVal} onSlots={onSlots} onSkip={onSkip}/>)}</tbody>
        </table>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:"1.5rem"}}>
        <button onClick={handleSave} disabled={saving} style={{background:BRAND.orange,color:"#fff",border:"none",borderRadius:8,padding:"9px 24px",fontSize:13,fontWeight:500,cursor:saving?"not-allowed":"pointer",opacity:saving?0.7:1,fontFamily:"'Outfit',sans-serif"}}>
          {saving?"Opslaan…":"Opslaan"}
        </button>
        {saved&&<span style={{fontSize:13,color:BRAND.success}}>☁ Opgeslagen en gesynchroniseerd</span>}
        {saveErr&&<span style={{fontSize:13,color:BRAND.danger}}>⚠ {saveErr}</span>}
      </div>
      <div style={{fontSize:13,fontWeight:500,color:BRAND.textMuted,marginBottom:10}}>Overzicht per collega</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:10}}>
        {collegaStats.map(({c,decl,tot,rend,total,allSkipped})=>{
          const allGood=total>0&&rend===total,noneGood=total===0||rend===0;
          return <div key={c} style={{background:"#fff",border:"0.5px solid "+BRAND.border,borderRadius:10,padding:"12px 14px",borderLeft:"3px solid "+(allSkipped?"#ccc":allGood?BRAND.greenMid:noneGood?BRAND.danger:BRAND.warn),opacity:allSkipped?0.5:1}}>
            <div style={{fontSize:13,fontWeight:500,color:BRAND.text,marginBottom:6}}>{c}</div>
            {allSkipped?<div style={{fontSize:11,color:BRAND.textMuted}}>Alle groepen vervallen</div>:<>
              <div style={{fontSize:22,fontWeight:600,color:BRAND.green}}>{decl}</div>
              <div style={{fontSize:11,color:BRAND.textMuted,marginBottom:6}}>declarabel / {tot} totaal</div>
              <div style={{fontSize:11,fontWeight:500,color:allGood?BRAND.success:noneGood?BRAND.danger:BRAND.warn}}>{rend}/{total} groepen rendabel</div>
            </>}
          </div>;
        })}
      </div>
    </div>
  );
}

// ── WEEK TAB ─────────────────────────────────────────────────────────────
function WeekTab() {
  const {weeks} = React.useContext(WeeksCtx);
  const [historyWeek,setHistoryWeek] = useState("");
  const sortedKeys = useMemo(()=>Object.keys(weeks).sort().reverse(),[weeks]);
  useEffect(()=>{ if(sortedKeys.length&&!historyWeek) setHistoryWeek(sortedKeys[0]); },[sortedKeys]);

  const data = useMemo(()=>{
    if(!historyWeek||!weeks[historyWeek]) return null;
    const m={};
    DEFAULT_GROUPS.forEach(g=>{ m[g.id]={...emptyRow(g.slots),...(weeks[historyWeek][g.id]||{})}; if(m[g.id]._slots==null)m[g.id]._slots=g.slots; });
    return m;
  },[historyWeek,weeks]);

  const stats = useMemo(()=>{
    if(!data) return null;
    const active=DEFAULT_GROUPS.filter(g=>!isSkip(data[g.id]));
    const totalSlots=active.reduce((s,g)=>s+getSlots(data[g.id],g),0);
    const totalPats=active.reduce((s,g)=>FINANCE.reduce((ss,fc)=>ss+getVal(data[g.id],fc),s),0);
    const totalDecl=active.reduce((s,g)=>s+getVal(data[g.id],"10007"),0);
    return {totalSlots,totalPats,totalDecl,bezetting:totalSlots>0?Math.round((totalPats/totalSlots)*100):0,bezettingDecl:totalSlots>0?Math.round((totalDecl/totalSlots)*100):0};
  },[data]);

  return (
    <div>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:"1.25rem",flexWrap:"wrap",background:BRAND.gray,borderRadius:8,padding:"10px 14px",border:"0.5px solid "+BRAND.border}}>
        <label style={{fontSize:13,color:BRAND.textMuted,fontWeight:500}}>Kies week</label>
        <select value={historyWeek} onChange={e=>setHistoryWeek(e.target.value)}>
          {!sortedKeys.length&&<option>Nog geen weken opgeslagen</option>}
          {sortedKeys.map(k=><option key={k} value={k}>{formatWeekLabel(k)}</option>)}
        </select>
      </div>
      {stats&&data?<>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12,marginBottom:"1.5rem"}}>
          {[{label:"Opengestelde zittingen",value:stats.totalSlots,sub:stats.bezetting+"% bezetting",color:BRAND.greenMid},
            {label:"Totaal patiënten",value:stats.totalPats,sub:stats.bezetting+"% bezetting",color:stats.bezetting>=100?BRAND.success:stats.bezetting>=75?BRAND.warn:BRAND.danger},
            {label:"Totaal declarabel",value:stats.totalDecl,sub:stats.bezettingDecl+"% van zittingen",color:stats.bezettingDecl>=100?BRAND.success:stats.bezettingDecl>=75?BRAND.warn:BRAND.danger},
          ].map(({label,value,sub,color})=>(
            <div key={label} style={{background:"#fff",border:"0.5px solid "+BRAND.border,borderRadius:12,padding:"16px 18px",borderTop:"3px solid "+color,textAlign:"center"}}>
              <div style={{fontSize:36,fontWeight:700,color:BRAND.text,lineHeight:1}}>{value}</div>
              <div style={{fontSize:12,color:BRAND.textMuted,margin:"4px 0 6px"}}>{label}</div>
              <span style={{padding:"2px 10px",borderRadius:20,fontSize:11,fontWeight:500,background:color+"22",color}}>{sub}</span>
            </div>
          ))}
        </div>
        <div style={{overflowX:"auto",borderRadius:10,border:"0.5px solid "+BRAND.border}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
            <thead><tr style={{background:BRAND.green}}>
              {["Dag","Tijd","Collega","Zittingen","Patiënten","Declarabel","Status"].map((h,i)=>(
                <th key={i} style={{textAlign:i>2?"center":"left",padding:"8px 10px",fontWeight:500,fontSize:12,color:"rgba(255,255,255,0.85)",whiteSpace:"nowrap"}}>{h}</th>
              ))}
            </tr></thead>
            <tbody>{DEFAULT_GROUPS.map((g,i)=>{
              const row=data[g.id],skipped=isSkip(row),slots=getSlots(row,g);
              const pats=FINANCE.reduce((s,fc)=>s+getVal(row,fc),0),decl=getVal(row,"10007");
              return <tr key={g.id} style={{borderBottom:"0.5px solid "+BRAND.border,background:skipped?"#f7f7f5":i%2===0?"#fff":BRAND.gray,opacity:skipped?0.55:1}}>
                <td style={{padding:"8px 10px",fontWeight:500}}>{g.day}</td>
                <td style={{padding:"8px 10px",color:BRAND.textMuted}}>{g.time}</td>
                <td style={{padding:"8px 10px"}}>{g.collega}</td>
                <td style={{textAlign:"center",padding:"8px 10px",color:BRAND.textMuted}}>{skipped?"—":slots}</td>
                <td style={{textAlign:"center",padding:"8px 10px"}}>{skipped?"—":<span style={{fontWeight:pats>0?600:400,color:pats>=slots?BRAND.success:pats>0?BRAND.warn:BRAND.danger}}>{pats}</span>}</td>
                <td style={{textAlign:"center",padding:"8px 10px"}}>{skipped?"—":<span style={{fontWeight:decl>0?600:400,color:decl>=slots?BRAND.success:decl>0?BRAND.warn:BRAND.danger}}>{decl}</span>}</td>
                <td style={{textAlign:"center",padding:"8px 10px"}}><Badge ok={isRend(row,g)} skipped={skipped}/></td>
              </tr>;
            })}</tbody>
          </table>
        </div>
      </>:<div style={{textAlign:"center",padding:"2rem",color:BRAND.textMuted,fontSize:13}}>Geen data voor deze week.</div>}
    </div>
  );
}

// ── MAAND TAB ─────────────────────────────────────────────────────────────
function MaandTab() {
  const {weeks} = React.useContext(WeeksCtx);
  const sortedWeekKeys = useMemo(()=>Object.keys(weeks).sort().reverse(),[weeks]);
  const availableMonths = useMemo(()=>[...new Set(sortedWeekKeys.map(getMonthKey))].sort().reverse(),[sortedWeekKeys]);
  const [monthKey,setMonthKey] = useState("");
  useEffect(()=>{ if(availableMonths.length&&!monthKey) setMonthKey(availableMonths[0]); },[availableMonths]);

  function getMonthData(mk) {
    if(!mk) return null;
    const [y,m]=mk.split("-").map(Number),ms=new Date(y,m-1,1),me=new Date(y,m,0);
    const rel=sortedWeekKeys.filter(k=>{ const mon=new Date(k+"T00:00:00"),fri=new Date(mon); fri.setDate(mon.getDate()+4); return fri>=ms&&mon<=me; });
    if(!rel.length) return null;
    const tot={};
    DEFAULT_GROUPS.forEach(g=>{
      const fc={}; FINANCE.forEach(f=>{fc[f]=0;});
      let aw=0,rw=0,ss=0;
      rel.forEach(wk=>{ const wd=weeks[wk]; if(!wd||!wd[g.id]||isSkip(wd[g.id])) return; const mon=new Date(wk+"T00:00:00"),gd=new Date(mon); gd.setDate(mon.getDate()+(GROUP_DAY_INDEX[g.id]||0)); if(gd<ms||gd>me) return; aw++; const sl=getSlots(wd[g.id],g); ss+=sl; FINANCE.forEach(f=>{fc[f]+=getVal(wd[g.id],f);}); if(getVal(wd[g.id],"10007")>=sl) rw++; });
      tot[g.id]={...fc,_skip:false,_slots:aw>0?Math.round(ss/aw):g.slots,_activeWeeks:aw,_rendWeeks:rw};
    });

    const kpiTop2=bezetting>=100?"#1a7a4a":bezetting>=75?"#b45309":"#c0392b",kpiTop3=bezettingDecl>=100?"#1a7a4a":bezettingDecl>=75?"#b45309":"#c0392b";

-weight:500;background:'+kpiTop2+'22;color:'+kpiTop2+'">'+bezetting+'% bezetting</span></div><div style="flex:1;border:1px solid #e0e0da;border-radius:8px;padding:12px 14px;text-align:center;border-top:3px solid '+kpiTop3+'"><div style="font-size:28px;font-weight:700">'+totalDecl+'</div><div style="font-size:10px;color:#6b6b65;margin:3px 0 5px">Totaal declarabel</div><span style="display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:500;background:'+kpiTop3+'22;color:'+kpiTop3+'">'+bezettingDecl+'% declarabel</span></div></div><h2>Overzicht alle groepen</h2><table><thead><tr><th>Dag</th><th>Tijd</th><th>Collega</th><th style="text-align:center">Zittingen</th><th style="text-align:center">Declarabel</th><th style="text-align:center">Status</th></tr></thead><tbody>'+groupRows+'</tbody></table><h2>Declarabiliteit per collega</h2><table><thead><tr><th>Collega</th><th style="text-align:center">Zittingen</th><th style="text-align:center">Declarabel</th><th style="text-align:center">%</th></tr></thead><tbody>'+collegaRows+'</tbody></table><h2>Actiepunten MT</h2>'+actieHTML+'<div style="margin-top:28px;padding-top:10px;border-top:1px solid #e0e0da;color:#6b6b65;font-size:10px;display:flex;justify-content:space-between"><span>FyzioFit Groepen · Fyzio Totaal</span><span>Rapport gegenereerd op '+printDate+' · '+maandNaam+'</span></div></body></html>';
    const win=window.open("","_blank");
    if(!win){alert("Sta pop-ups toe om het rapport te openen.");return;}
    win.document.write(html); win.document.close();
    setTimeout(function(){win.focus();win.print();},400);
  }

  return (
    <div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"1.5rem",flexWrap:"wrap",gap:10}}>
        <div>
          <div style={{fontSize:18,fontWeight:700,color:BRAND.green}}>MT Dashboard</div>
          <div style={{fontSize:12,color:BRAND.textMuted}}>Maandrapportage Fyzio Totaal — FyzioFit groepen</div>
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
          <select value={mtMonth} onChange={e=>setMtMonth(e.target.value)}>
            {availableMonths.map(mk=>{const p=mk.split("-");return <option key={mk} value={mk}>{new Date(+p[0],+p[1]-1,1).toLocaleDateString("nl-NL",{month:"long",year:"numeric"})}</option>;})}
          </select>
          <button onClick={handlePDF} style={{background:BRAND.green,color:"#fff",border:"none",borderRadius:8,padding:"7px 16px",fontSize:13,fontWeight:500,cursor:"pointer",fontFamily:"'Outfit',sans-serif"}}>
            📄 PDF rapport
          </button>
        </div>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12,marginBottom:"1.5rem"}}>
        {[{label:"Opengestelde zittingen",value:totalSlots,sub:ag.length+" groepen · "+mtData.weekCount+" wkn",color:BRAND.greenMid},
          {label:"Totaal patiënten",value:totalPats,sub:bezetting+"% bezetting",color:bezetting>=100?BRAND.success:bezetting>=75?BRAND.warn:BRAND.danger},
          {label:"Totaal declarabel",value:totalDecl,sub:bezettingDecl+"% van zittingen",color:bezettingDecl>=100?BRAND.success:bezettingDecl>=75?BRAND.warn:BRAND.danger},
        ].map(({label,value,sub,color})=>(
          <div key={label} style={{background:"#fff",border:"0.5px solid "+BRAND.border,borderRadius:12,padding:"16px 18px",borderTop:"3px solid "+color,textAlign:"center"}}>
            <div style={{fontSize:36,fontWeight:700,color:BRAND.text,lineHeight:1}}>{value}</div>
            <div style={{fontSize:12,color:BRAND.textMuted,margin:"4px 0 6px"}}>{label}</div>
            <span style={{padding:"2px 10px",borderRadius:20,fontSize:11,fontWeight:500,background:color+"22",color}}>{sub}</span>
          </div>
        ))}
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:"1.5rem"}}>
        <div style={{background:"#fff",border:"0.5px solid "+BRAND.border,borderRadius:12,padding:"16px 18px"}}>
          <div style={{fontSize:13,fontWeight:600,color:BRAND.text,marginBottom:14}}>Declarabiliteit per collega</div>
          {collegaStats.map(({c,slots,decl,pct})=>{ const color=pct>=100?BRAND.success:pct>=75?BRAND.warn:BRAND.danger; return (
            <div key={c} style={{marginBottom:10}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                <span style={{fontSize:13,fontWeight:500}}>{c}</span>
                <span style={{fontSize:12,color:BRAND.textMuted}}>{decl}/{slots} <span style={{fontWeight:600,color}}>{pct}%</span></span>
              </div>
              <PctBar pct={pct}/>
            </div>
          );})}
        </div>
        <div style={{background:"#fff",border:"0.5px solid "+BRAND.border,borderRadius:12,padding:"16px 18px"}}>
          <div style={{fontSize:13,fontWeight:600,color:BRAND.text,marginBottom:14}}>Groepen — beste t/m slechtste</div>
          {groupRanking.map(({g,slots,decl,pct},idx)=>{ const color=pct>=100?BRAND.success:pct>=75?BRAND.warn:BRAND.danger; const medal=idx===0?"🥇":idx===1?"🥈":idx===2?"🥉":""; return (
            <div key={g.id} style={{display:"flex",alignItems:"center",gap:8,marginBottom:9}}>
              <span style={{fontSize:13,minWidth:16,textAlign:"center"}}>{medal||<span style={{fontSize:11,color:BRAND.textMuted}}>{"#"+(idx+1)}</span>}</span>
              <span style={{fontSize:12,minWidth:110}}>{g.day} {g.time}<span style={{color:BRAND.textMuted}}> · {g.collega}</span></span>
              <PctBar pct={pct}/>
              <span style={{fontSize:12,fontWeight:600,color,minWidth:38,textAlign:"right"}}>{pct}%</span>
            </div>
          );})}
        </div>
      </div>

      <div style={{background:"#fff",border:"0.5px solid "+BRAND.border,borderRadius:12,padding:"16px 18px",marginBottom:"1.5rem"}}>
        <div style={{fontSize:13,fontWeight:600,color:BRAND.text,marginBottom:14}}>Trend — over tijd</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:16}}>
          {[{key:"slots",label:"Zittingen",color:BRAND.greenMid},{key:"pats",label:"Patiënten",color:BRAND.orange},{key:"decl",label:"Declarabel",color:BRAND.success}].map(({key,label,color})=>(
            <div key={key}>
              <div style={{fontSize:11,color:BRAND.textMuted,fontWeight:500,marginBottom:6,textTransform:"uppercase",letterSpacing:"0.4px"}}>{label}</div>
              <TrendLine data={trendData} valueKey={key} color={color}/>
            </div>
          ))}
        </div>
      </div>

      <div style={{background:"#fff",border:"0.5px solid "+BRAND.border,borderRadius:12,padding:"16px 18px"}}>
        <div style={{fontSize:13,fontWeight:600,color:BRAND.text,marginBottom:14}}>Actiepunten voor het MT {acties.length>0&&"("+acties.length+")"}</div>
        {acties.length===0?(
          <div style={{background:BRAND.successBg,border:"1px solid "+BRAND.success,borderRadius:10,padding:"14px 18px",fontSize:13,color:BRAND.success}}>✓ Geen actiepunten — alle groepen waren rendabel.</div>
        ):acties.map(({g,slots,decl,pct})=>{
          const urgent=pct<75,tekort=slots-decl,history=getGroupHistory(g.id);
          const notRendMonths=history.filter(h=>h.pct<100&&!h.isCurrent).length;
          const structureel=notRendMonths>=2,incidenteel=notRendMonths===0&&history.length>1;
          const patroonTxt=structureel?"Structureel — al "+notRendMonths+" voorgaande maand"+(notRendMonths!==1?"en":"")+" niet rendabel":incidenteel?"Incidenteel — voorgaande maanden wél rendabel":history.length<=1?"Onvoldoende historische data":notRendMonths+" voorgaande maand niet rendabel";
          const patroonColor=structureel?BRAND.danger:incidenteel?BRAND.success:BRAND.warn;
          return (
            <div key={g.id} style={{padding:"12px 14px",borderRadius:10,background:urgent?BRAND.dangerBg:BRAND.warnBg,border:"0.5px solid "+(urgent?BRAND.danger:BRAND.warn),marginBottom:12}}>
              <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:12,flexWrap:"wrap"}}>
                <div style={{flex:1,minWidth:180}}>
                  <div style={{fontSize:13,fontWeight:600,color:BRAND.text}}>{g.day} {g.time} · {g.collega}</div>
                  <div style={{fontSize:12,color:BRAND.textMuted,margin:"2px 0 6px"}}>{pct}% declarabel — {tekort} zitting{tekort!==1?"en":""} onder grens</div>
                  <span style={{display:"inline-flex",alignItems:"center",gap:5,padding:"3px 10px",borderRadius:20,fontSize:11,fontWeight:500,background:patroonColor+"18",color:patroonColor,border:"0.5px solid "+patroonColor+"44"}}>
                    <span style={{width:6,height:6,borderRadius:"50%",background:patroonColor,flexShrink:0}}/>{patroonTxt}
                  </span>
                  <div style={{marginTop:10,fontSize:11,color:BRAND.textMuted,fontWeight:500,marginBottom:4}}>Maandhistorie</div>
                  <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
                    <thead><tr style={{background:BRAND.green}}>{["Maand","Zittingen","Declarabel","%"].map((h,i)=><th key={i} style={{padding:"5px 7px",textAlign:i===0?"left":"center",fontWeight:500,fontSize:10,color:"rgba(255,255,255,0.85)"}}>{h}</th>)}</tr></thead>
                    <tbody>{history.map((hm)=>{ const pc=hm.pct>=100?BRAND.success:hm.pct>=75?BRAND.warn:BRAND.danger; return <tr key={hm.mk} style={{borderBottom:"0.5px solid "+BRAND.border,background:hm.isCurrent?BRAND.gray:"#fff",fontWeight:hm.isCurrent?600:400}}><td style={{padding:"5px 7px"}}>{hm.label}{hm.isCurrent?" ◀":""}</td><td style={{padding:"5px 7px",textAlign:"center"}}>{hm.slots}</td><td style={{padding:"5px 7px",textAlign:"center"}}>{hm.decl}</td><td style={{padding:"5px 7px",textAlign:"center",color:pc,fontWeight:600}}>{hm.pct}%</td></tr>; })}</tbody>
                  </table>
                </div>
                <div style={{minWidth:230,flex:"0 0 auto"}}>
                  <div style={{fontSize:10,color:BRAND.textMuted,marginBottom:4,fontWeight:500,textTransform:"uppercase",letterSpacing:"0.4px"}}>Declarabiliteit per maand</div>
                  <MiniTrendBar history={history}/>
                </div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── ROOT APP ──────────────────────────────────────────────────────────────
function App() {
  const [tab,setTab] = useState("invoer");
  const [formData,setFormData] = useState(emptyForm);
  const [weeks,setWeeks] = useState({});
  const [syncStatus,setSyncStatus] = useState("loading");
  const [syncMsg,setSyncMsg] = useState("");

  async function reload() {
    setSyncStatus("loading");
    try {
      const d = await loadAll();
      setWeeks(d);
      setSyncStatus("ok"); setSyncMsg("");
    } catch(e) {
      setSyncStatus("error"); setSyncMsg(e.message);
    }
  }
  useEffect(()=>{ reload(); },[]);

  const ctxValue = useMemo(()=>({weeks,reload,syncStatus,syncMsg}),[weeks,syncStatus,syncMsg]);
  const tabs=[{id:"invoer",label:"Invoer"},{id:"week",label:"Weekoverzicht"},{id:"maand",label:"Maandoverzicht"},{id:"mt",label:"MT Dashboard"}];

  return (
    <WeeksCtx.Provider value={ctxValue}>
      <div style={{fontFamily:"'Outfit',sans-serif"}}>
        <div style={{background:BRAND.green,padding:"18px 24px 0",borderRadius:"12px 12px 0 0"}}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
            <div style={{width:36,height:36,borderRadius:8,background:BRAND.orange,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20}}>💪</div>
            <div>
              <div style={{fontSize:16,fontWeight:600,color:"#fff"}}>FyzioFit uren</div>
              <div style={{fontSize:11,color:"rgba(255,255,255,0.6)"}}>Fyzio Totaal — Rendabiliteitsmonitor</div>
            </div>
            <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:6,background:"rgba(255,255,255,0.12)",borderRadius:6,padding:"4px 10px",fontSize:11,color:"rgba(255,255,255,0.75)"}}>
              ☁ Gedeelde opslag
            </div>
          </div>
          <div style={{display:"flex",gap:2}}>
            {tabs.map(t=>(
              <button key={t.id} onClick={()=>setTab(t.id)} style={{background:tab===t.id?"#fff":"transparent",border:"none",borderRadius:"8px 8px 0 0",padding:"8px 16px",fontSize:13,fontWeight:tab===t.id?500:400,color:tab===t.id?BRAND.green:"rgba(255,255,255,0.75)",cursor:"pointer",fontFamily:"'Outfit',sans-serif"}}>
                {t.label}
              </button>
            ))}
          </div>
        </div>
        <div style={{background:"#fff",border:"0.5px solid "+BRAND.border,borderTop:"none",borderRadius:"0 0 12px 12px",padding:"20px"}}>
          {syncStatus==="loading"&&!Object.keys(weeks).length
            ?<div style={{textAlign:"center",padding:"3rem",color:BRAND.textMuted}}>Data laden uit gedeelde database…</div>
            :<>
              {tab==="invoer"&&<InvoerTab formData={formData} setFormData={setFormData}/>}
              {tab==="week"&&<WeekTab/>}
              {tab==="maand"&&<MaandTab/>}
              {tab==="mt"&&<MTTab/>}
            </>
          }
          <div style={{marginTop:"1.5rem",paddingTop:"1rem",borderTop:"0.5px solid "+BRAND.border,display:"flex",justifyContent:"flex-end",fontSize:11,color:BRAND.textMuted,alignItems:"center",gap:6}}>
            ☁ Gegevens worden opgeslagen in gedeelde Supabase-database
          </div>
        </div>
      </div>
    </WeeksCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
